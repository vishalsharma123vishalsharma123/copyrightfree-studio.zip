name: Android CI Auto-Repair Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v4

    - name: Setup ZIP Extractor
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        unzip -o copyrightfree-studio.zip -d .
        cp -r copyrightfree-studio/* . || true

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Auto-Fix Permissions
      run: |
        chmod +x gradlew || true
        chmod +x copyrightfree-studio/gradlew || true

    - name: Build APK (Auto-Fix Warnings & Force Build)
      run: |
        ./gradlew assembleDebug -x lint -x test --stacktrace --continue || ./copyrightfree-studio/gradlew assembleDebug -x lint -x test --stacktrace --continue

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Safe-Auto-Built-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
