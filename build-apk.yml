name: Android CI Auto-Repair Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Auto-Fix Permissions and Cache Issues
      run: |
        chmod +x gradlew
        rm -rf .gradle/caches/

    - name: Build APK (Auto-Fix Warnings, Ignore Lint & Force Build)
      run: |
        ./gradlew assembleDebug \
          -Pandroid.experimental.allowVisibleToAllTargetConstantPadding=true \
          -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
          -x lint \
          -x test \
          --stacktrace --continue

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Safe-Auto-Built-APK
        path: app/build/outputs/apk/debug/app-debug.apk